ServerName taxlab.local

<VirtualHost *:80>
    DocumentRoot /var/www/vhosts/taxlab.ru/httpdocs

    <Directory /var/www/vhosts/taxlab.ru/httpdocs>
        Options -Indexes +FollowSymLinks
        Require all granted

        # .htaccess зеркала намеренно не читаем: там 301 на https://taxlab.ru,
        # deny по трём IP и старый синтаксис order/allow, а webp-express кладёт
        # свои .htaccess в uploads и подменяет картинки на .webp, которых
        # локально может не быть. Нужные правила WP — ниже.
        AllowOverride None

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # protect918 — антибот antibot.cloud (653 МБ в зеркале), F_F — adminer.
    # На стенде оба не нужны и только мешают: закрываем.
    <LocationMatch "^/(protect918|F_F)/">
        Require all denied
    </LocationMatch>

    # Дебажные файлы, которые живут в корне прода. Локально пусть будут закрыты.
    <FilesMatch "^(index_2\.php|phpinfo\.php)$">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    TransferLog /dev/stdout
    LogLevel warn
</VirtualHost>
