; ВАЖНО: как на проде (php.ini vhost'а taxlab.ru). В umbrella-group/functions.php
; около строки 1093 стоит `?>` и дальше пустые строки перед новым `<?php` — эти
; переводы строк уходят в вывод раньше заголовков. С буфером они безобидны, без
; него ломается всё, что редиректит: логин, wp-admin, canonical. В официальном
; php:8.3-apache буферизация выключена, поэтому включаем явно.
output_buffering = 14096

; Лимиты щедрее прода (там 256M / 30s): тема тяжёлая, а импорт и админка на
; дефолтных 128M спотыкаются.
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 128M
post_max_size = 128M
max_input_vars = 5000

; Ошибки — в логи контейнера (docker compose logs), а не в вёрстку: WP 6.5 с
; PHP 8.3 сыплет deprecated из плагинов, и на странице это выглядит как поломка.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Правки темы должны быть видны сразу, без ребута контейнера.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

date.timezone = Europe/Moscow
